name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run lints (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --all-targets --verbose

  ui-snapshot-check:
    name: Headless UI & Snapshot Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies, ImageMagick & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            pkg-config \
            libssl-dev \
            imagemagick \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Generate headless snapshots using virtual framebuffer & software renderer
        run: |
          mkdir -p /tmp/ci-snapshots
          xvfb-run -a env SLINT_BACKEND=winit-software cargo run -- --snapshot /tmp/ci-snapshots

      - name: Verify generated snapshot files
        run: |
          ls -la /tmp/ci-snapshots
          test -f /tmp/ci-snapshots/aur-view-last-modified.png
          test -f /tmp/ci-snapshots/aur-view-last-modified-dark.png
          test -f /tmp/ci-snapshots/aur-view-search.png
          test -f /tmp/ci-snapshots/aur-view-detail.png
          test -f /tmp/ci-snapshots/aur-view-detail-dark.png
          test -f /tmp/ci-snapshots/aur-view-settings.png
          test -f /tmp/ci-snapshots/aur-view-settings-dark.png

      - name: Upload UI snapshot artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: /tmp/ci-snapshots/*.png
          if-no-files-found: warn

  release-check:
    name: Release Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Check release compilation
        run: cargo check --release --verbose
