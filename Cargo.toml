[package]
name = "aurbreak"
version = "0.1.2"
edition = "2024"
description = "A very fast lightweight offline-first app for for browsing, searching, and inspecting packages from the Arch User Repository (AUR)"
authors = ["AURbreak Developers"]
license = "GPL-3.0-or-later"
repository = "https://github.com/snowballons/AURbreak"

[[bin]]
name = "aurbreak"
path = "src/main.rs"

[package.metadata.deb]
name = "aurbreak"
maintainer = "AURbreak Developers"
copyright = "2026 AURbreak"
license-file = ["LICENSE", "4"]
extended-description = """\
AURbreak is a very fast lightweight offline-first app for for browsing, searching, and inspecting packages from the Arch User Repository (AUR), \
built with Slint and Rust."""
depends = "$auto, libfontconfig1, libxkbcommon0, libxkbcommon-x11-0"
section = "utils"
priority = "optional"
assets = [
    ["target/release/aurbreak", "usr/bin/aurbreak", "755"],
    ["packaging/aurbreak.desktop", "usr/share/applications/aurbreak.desktop", "644"],
    ["ui/assets/aurbreak-icon-app.svg", "usr/share/icons/hicolor/scalable/apps/aurbreak.svg", "644"],
    ["LICENSE", "usr/share/doc/aurbreak/copyright", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/aurbreak", dest = "/usr/bin/aurbreak", mode = "755" },
    { source = "packaging/aurbreak.desktop", dest = "/usr/share/applications/aurbreak.desktop", mode = "644" },
    { source = "ui/assets/aurbreak-icon-app.svg", dest = "/usr/share/icons/hicolor/scalable/apps/aurbreak.svg", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/aurbreak/LICENSE", mode = "644" },
]

[dependencies]
slint = "1.18.1"
reqwest = { version = "0.13.5", features = ["blocking", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
directories = "6.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
open = "5.4.5"

[build-dependencies]
slint-build = "1.18.1"

# Release: "thin" LTO gives near-fat-LTO benefit at a fraction of the compile
# time. The full "fat" LTO here exceeds the build budget (Slint's dep tree is
# large), so "thin" is the pragmatic choice for a shippable binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Keep dependency compilation cheap in dev so `cargo test`/`cargo clippy` stay
# usable instead of timing out on the Slint + reqwest tree.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
